[package]
name        = "persona-pack-cli"
description = "CLI for persona-pack — list/dump Personas, run MCP server"
readme      = "../../README.md"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true
keywords    = ["persona", "llm", "prompt", "cli"]
categories  = ["command-line-utilities"]

[[bin]]
name = "persona-pack"
path = "src/main.rs"

[dependencies]
persona-pack     = { path = "../persona-pack", version = "0.3.0" }
persona-pack-mcp = { path = "../persona-pack-mcp", version = "0.3.0" }
clap             = { version = "4", features = ["derive"] }
serde_json       = "1"
anyhow           = { workspace = true }
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
assert_cmd   = "2"
tempfile     = "3"
serde_json   = "1"
anyhow       = { workspace = true }
persona-pack = { path = "../persona-pack", version = "0.3.0" }
rmcp         = { version = "1.6", features = ["client", "transport-child-process"] }
tokio        = { version = "1", features = ["full"] }
